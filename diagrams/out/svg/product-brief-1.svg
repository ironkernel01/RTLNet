<line x1="345.6" y1="302.4" x2="345.6" y2="255.6" stroke="#000" stroke-width="0.75" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<foreignObject x="351.36" y="272.16" width="64.8" height="12.96"><div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif;color:#000;font-size:7.5px;display:flex;align-items:flex-end;justify-content:flex-start;white-space:nowrap">AXI4-Lite</div></foreignObject>
<foreignObject x="43.2" y="403.2" width="871.2" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif;color:#000;font-size:7.5px;line-height:1.2"><div style="font-weight:bold">NOTES:</div><div style="margin-bottom:2px">1. All RTL is SystemVerilog-2012. Vendor-specific cells live only in the RAM, shift-register, synchronizer and RGMII pin files; one include file selects AMD, Altera, Lattice or a generic model.</div><div style="margin-bottom:2px">2. Every data path is a 64-bit AXI4-Stream; every core has an AXI4-Lite register slave (ID, VERSION, CAPS). The CPU reaches all core registers over AXI4-Lite; one dashed connector stands for that bus.</div><div style="margin-bottom:2px">3. Frames that no RTL leaf claims go to the CPU. ARP, ping, DHCP and UDP iperf are answered in logic and never reach the CPU.</div></div></foreignObject>
